name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must already be enabled with Source = "GitHub Actions" in repo
      # settings. GITHUB_TOKEN can deploy to Pages but cannot create the site
      # (that needs repo-admin scope), so enablement here only verifies it.
      - uses: actions/configure-pages@v5

      # The app is plain static files — no build step, upload the repo as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
