<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — a goal timeline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#16232B;
    --panel:#1E2F3A;
    --panel-2:#28414D;
    --line:rgba(232,226,208,0.12);
    --parchment:#ECE4D0;
    --muted:#93A8A2;
    --brass:#C98A4B;
    --brass-dim:rgba(201,138,75,0.30);
    --seafoam:#6FA88F;
    --seafoam-dim:rgba(111,168,143,0.22);
    --coral:#C1685F;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--ink); color:var(--parchment);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2{ font-family:'Fraunces',Georgia,serif; margin:0; }
  button,input,textarea{ font-family:inherit; color:inherit; }
  ::selection{ background:var(--brass-dim); }

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:flex-end; flex-wrap:wrap; gap:18px 28px;
    padding:20px 24px; background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:8px; color:var(--brass);
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; }
  .brand svg{ display:block; }
  .goal-block{ flex:1 1 260px; min-width:0; }
  .goal-title{ font-size:clamp(21px,3.4vw,30px); font-weight:600; line-height:1.15;
    background:transparent; border:none; padding:0; cursor:pointer; text-align:left; }
  .goal-title:hover{ color:var(--brass); }
  .goal-date{ margin-top:4px; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    color:var(--muted); letter-spacing:.03em; }
  .header-right{ display:flex; align-items:center; gap:20px; }
  .progress-text{ font-size:11.5px; color:var(--muted); margin-bottom:6px; text-align:right;
    font-family:'IBM Plex Mono',monospace; }
  .progress-track{ width:170px; height:6px; border-radius:4px; background:var(--panel-2); overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:var(--brass); transition:width .4s ease; }
  .link-btn{ background:none; border:1px solid var(--line); color:var(--muted); font-size:12px;
    padding:8px 12px; border-radius:20px; cursor:pointer; white-space:nowrap; }
  .link-btn:hover{ color:var(--parchment); border-color:var(--muted); }

  /* ---------- Legend ---------- */
  .legend{ display:flex; flex-wrap:wrap; gap:14px 22px; padding:12px 24px;
    background:var(--ink); border-bottom:1px solid var(--line); }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted); }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
  .dot-locked{ border:1.5px dashed var(--muted); }
  .dot-available{ border:1.5px solid var(--brass); box-shadow:0 0 0 3px var(--brass-dim); }
  .dot-progress{ background:var(--brass); }
  .dot-complete{ background:var(--seafoam); }
  .dot-goal{ background:none; border:1.5px solid var(--brass); border-radius:3px; transform:rotate(45deg); }

  /* ---------- Stage ---------- */
  .stage{ padding:20px 24px 48px; }
  .stage-toolbar{ display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:14px; }
  .stage-hint{ font-size:12px; color:var(--muted); }
  .btn-primary{ background:var(--brass); color:var(--ink); border:none; font-weight:600;
    font-size:13px; padding:10px 16px; border-radius:8px; cursor:pointer; }
  .btn-primary:hover{ filter:brightness(1.08); }

  .canvas-wrap{ border:1px solid var(--line); border-radius:14px; background:
    radial-gradient(ellipse at top left, rgba(201,138,75,0.05), transparent 60%), var(--panel); }
  .canvas-wrap.scroll-x{ overflow-x:auto; overflow-y:hidden; height:min(560px,72vh); }
  .canvas-wrap.scroll-y-page{ overflow:visible; }
  .canvas{ position:relative; }
  .canvas.canvas-empty{ padding:56px 20px; display:flex; align-items:center; justify-content:center; }

  .edges{ position:absolute; top:0; left:0; pointer-events:none; }
  .contour path{ fill:none; stroke:var(--parchment); opacity:.05; stroke-width:1; }
  .edge{ fill:none; }
  .edge-complete{ stroke:var(--seafoam); stroke-width:3; }
  .edge-active{ stroke:var(--brass); stroke-width:3; }
  .edge-locked{ stroke:var(--muted); opacity:.35; stroke-width:2; stroke-dasharray:2 7; }

  .waypoint{ position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column;
    align-items:center; width:132px; }
  .marker{ width:52px; height:52px; border-radius:50%; border:2px solid var(--muted); background:var(--panel);
    color:var(--parchment); display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease; }
  .marker:hover{ transform:scale(1.07); }
  .marker:focus-visible{ outline:2px solid var(--brass); outline-offset:3px; }

  .state-locked .marker{ border-style:dashed; opacity:.55; color:var(--muted); }
  .state-available .marker{ border-color:var(--brass); box-shadow:0 0 0 4px var(--brass-dim); }
  .state-in-progress .marker{ border-color:var(--brass); background:var(--brass); color:var(--ink);
    animation:pulse 2.2s ease-in-out infinite; }
  .state-complete .marker{ border-color:var(--seafoam); background:var(--seafoam); color:var(--ink); }

  .is-goal .marker{ width:76px; height:76px; border-width:3px; }
  .is-goal.state-locked .marker{ border-style:solid; opacity:.85; background:transparent; color:var(--brass); }
  .is-goal.state-complete .marker{ background:var(--seafoam); color:var(--ink); }

  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 var(--brass-dim);} 50%{ box-shadow:0 0 0 9px transparent;} }
  @media (prefers-reduced-motion:reduce){ .marker{ animation:none!important; transition:none!important; } }

  .label{ margin-top:8px; text-align:center; }
  .label-title{ display:block; font-size:12.5px; font-weight:600; line-height:1.25; }
  .is-goal .label-title{ font-family:'Fraunces',serif; font-size:14px; }
  .label-date{ display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); margin-top:2px; }
  .state-locked .label-title{ color:var(--muted); }

  .empty-card{ max-width:360px; text-align:center; }
  .empty-card h2{ font-size:22px; margin-bottom:8px; }
  .empty-card p{ font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:18px; }
  .empty-form{ display:flex; flex-direction:column; gap:10px; }
  .empty-form input{ background:var(--ink); border:1px solid var(--line); color:var(--parchment);
    padding:10px 12px; border-radius:8px; font-size:14px; }

  /* ---------- Panel ---------- */
  .scrim{ position:fixed; inset:0; background:rgba(10,14,17,.55); opacity:0; pointer-events:none;
    transition:opacity .2s ease; z-index:40; }
  .scrim.open{ opacity:1; pointer-events:auto; }

  .panel{ position:fixed; top:0; right:0; height:100vh; width:400px; max-width:92vw;
    background:var(--panel); border-left:1px solid var(--line); transform:translateX(100%);
    transition:transform .25s ease; z-index:50; overflow-y:auto; padding:26px; }
  .panel.open{ transform:translateX(0); }
  @media (max-width:760px){
    .panel{ left:0; right:0; width:auto; max-width:none; top:auto; bottom:0; height:auto;
      max-height:85vh; border-left:none; border-top:1px solid var(--line);
      border-radius:18px 18px 0 0; transform:translateY(100%); }
    .panel.open{ transform:translateY(0); }
  }
  .panel-close{ position:absolute; top:18px; right:18px; background:none; border:none;
    color:var(--muted); font-size:16px; cursor:pointer; }
  .panel-close:hover{ color:var(--parchment); }
  .panel-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em;
    color:var(--brass); text-transform:uppercase; margin-bottom:6px; }
  .panel-title{ font-size:22px; font-weight:600; margin-bottom:6px; padding-right:20px; }
  .panel-date{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); margin-bottom:18px; }

  .pill-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
  .pill{ border:none; border-radius:20px; padding:9px 15px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .pill-brass{ background:var(--brass); color:var(--ink); }
  .pill-seafoam{ background:var(--seafoam); color:var(--ink); }
  .pill-outline{ background:transparent; border:1px solid var(--brass); color:var(--brass); }
  .pill-link{ background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer;
    text-decoration:underline; text-underline-offset:2px; padding:0; }
  .pill-link:hover{ color:var(--parchment); }
  .locked-note{ font-size:13px; color:var(--muted); margin-bottom:8px; }
  .complete-note{ font-size:13px; color:var(--seafoam); font-weight:600; margin-bottom:8px; }

  .field-label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); margin:18px 0 8px; display:block; }
  .panel-desc{ font-size:13.5px; line-height:1.6; color:var(--parchment); }
  .muted-small{ font-size:12px; color:var(--muted); }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .dep-chip{ background:var(--panel-2); border:1px solid var(--line); color:var(--parchment);
    font-size:11.5px; padding:6px 11px; border-radius:14px; cursor:pointer; }
  .dep-chip:hover{ border-color:var(--brass); }
  .dep-chip.dep-complete{ border-color:var(--seafoam); }
  .dep-chip.dep-locked{ opacity:.6; }

  .subtask-list{ display:flex; flex-direction:column; gap:8px; }
  .subtask-row{ display:flex; align-items:flex-start; gap:9px; font-size:13px; cursor:pointer; }
  .subtask-row input{ margin-top:3px; accent-color:var(--brass); }
  .subtask-row .done{ color:var(--muted); text-decoration:line-through; }
  .add-subtask-form{ display:flex; gap:8px; margin-top:10px; }
  .add-subtask-form input{ flex:1; background:var(--ink); border:1px solid var(--line);
    color:var(--parchment); padding:8px 10px; border-radius:8px; font-size:12.5px; }

  .goal-form{ display:flex; flex-direction:column; }
  .goal-form input, .goal-form textarea{ width:100%; background:var(--ink); border:1px solid var(--line);
    color:var(--parchment); padding:9px 11px; border-radius:8px; font-size:13.5px; margin-top:6px; }
  .goal-form label.field-label{ margin-top:16px; }
  .goal-form button{ margin-top:20px; align-self:flex-start; }
  .check-list{ display:flex; flex-direction:column; gap:8px; max-height:160px; overflow-y:auto;
    border:1px solid var(--line); border-radius:8px; padding:10px; }
  .check-row{ display:flex; align-items:center; gap:9px; font-size:13px; cursor:pointer; }
  .check-row input{ accent-color:var(--brass); }

  .delete-link{ margin-top:26px; background:none; border:none; color:var(--coral); font-size:12px;
    cursor:pointer; text-decoration:underline; text-underline-offset:2px; padding:0; }

  @media (max-width:760px){
    .topbar{ padding:16px 16px; } .stage{ padding:16px; } .legend{ padding:10px 16px; }
    .header-right{ width:100%; justify-content:space-between; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M6 3v18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 4h11l-3 4 3 4H6" fill="currentColor" stroke="none"/></svg>
      WAYPOINT
    </div>
    <div class="goal-block">
      <button id="goalTitleEl" class="goal-title" title="Open destination details"></button>
      <div id="goalDateEl" class="goal-date"></div>
    </div>
    <div class="header-right">
      <div class="progress">
        <div id="progressText" class="progress-text"></div>
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      </div>
      <button id="newGoalBtn" class="link-btn">+ New goal</button>
    </div>
  </header>

  <div class="legend">
    <span class="legend-item"><i class="dot dot-locked"></i>Locked</span>
    <span class="legend-item"><i class="dot dot-available"></i>Ready</span>
    <span class="legend-item"><i class="dot dot-progress"></i>In progress</span>
    <span class="legend-item"><i class="dot dot-complete"></i>Complete</span>
    <span class="legend-item"><i class="dot dot-goal"></i>Destination</span>
  </div>

  <main class="stage">
    <div class="stage-toolbar">
      <span class="stage-hint">Tap any waypoint to open it</span>
      <button id="addWaypointBtn" class="btn-primary">+ Add waypoint</button>
    </div>
    <div id="canvasWrap" class="canvas-wrap">
      <div id="canvas" class="canvas"></div>
    </div>
  </main>
</div>

<div id="scrim" class="scrim"></div>
<aside id="panel" class="panel" role="dialog" aria-modal="true" aria-label="Waypoint details"></aside>

<script>
(function(){
  let taskIdCounter = 10;
  const state = {
    goalTitle: "Publish My Novel",
    goalDate: "2027-03-01",
    tasks: [
      {id:'t1', title:'Outline the story', due:'2026-09-05', status:'complete', dependsOn:[],
        desc:'Three-act structure, character sheets, and a chapter-by-chapter beat sheet.',
        subtasks:[{text:'Draft logline',done:true},{text:'Map character arcs',done:true},{text:'Chapter beat sheet',done:true}]},
      {id:'t2', title:'Set a writing routine', due:'2026-09-05', status:'complete', dependsOn:[],
        desc:'Block daily writing time and pick a way to track progress.',
        subtasks:[{text:'Choose a daily word target',done:true},{text:'Block calendar time',done:true}]},
      {id:'t3', title:'Write the first draft', due:'2026-12-20', status:'in-progress', dependsOn:['t1','t2'],
        desc:'Get the whole story down before revising anything.',
        subtasks:[{text:'Act I complete',done:true},{text:'Act II complete',done:false},{text:'Act III complete',done:false}]},
      {id:'t9', title:'Build an author landing page', due:'2026-11-01', status:'todo', dependsOn:['t2'],
        desc:'A simple one-pager to collect emails ahead of launch.',
        subtasks:[{text:'Pick a domain name',done:false},{text:'Write opt-in copy',done:false}]},
      {id:'t4', title:'Get beta reader feedback', due:'2027-01-15', status:'todo', dependsOn:['t3'],
        desc:'Send the draft to four or five readers with a short question list.', subtasks:[]},
      {id:'t5', title:'Design the book cover', due:'2027-01-15', status:'todo', dependsOn:['t3'],
        desc:'Brief a designer using two comparable covers in the genre.', subtasks:[]},
      {id:'t6', title:'Revise the manuscript', due:'2027-02-01', status:'todo', dependsOn:['t4','t5'],
        desc:'Fold in reader feedback and fix structural issues.', subtasks:[]},
      {id:'t7', title:'Copyedit & proofread', due:'2027-02-15', status:'todo', dependsOn:['t6'],
        desc:'A line-level pass, ideally by someone other than you.', subtasks:[]},
      {id:'t8', title:'Format for ebook & print', due:'2027-02-25', status:'todo', dependsOn:['t7'],
        desc:'Typeset both editions and generate proof copies.', subtasks:[]},
    ]
  };

  let currentOrientation = null;

  /* ---------- helpers ---------- */
  const taskById = id => state.tasks.find(t=>t.id===id);
  const allDepsComplete = t => t.dependsOn.every(d => taskById(d) && taskById(d).status==='complete');
  const displayState = t => {
    if(t.status==='complete') return 'complete';
    if(!allDepsComplete(t)) return 'locked';
    if(t.status==='in-progress') return 'in-progress';
    return 'available';
  };
  const leaves = () => {
    const dependedOn = new Set();
    state.tasks.forEach(t=>t.dependsOn.forEach(d=>dependedOn.add(d)));
    return state.tasks.filter(t=>!dependedOn.has(t.id)).map(t=>t.id);
  };
  const goalDeps = () => leaves();
  const goalDisplayState = () => {
    const deps = goalDeps();
    if(!deps.length) return 'locked';
    return deps.every(id=>taskById(id).status==='complete') ? 'complete' : 'locked';
  };
  const escapeHtml = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const formatDate = iso => { if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return isNaN(d)?'—':d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
  const formatDateLong = iso => { if(!iso) return 'No date set'; const d=new Date(iso+'T00:00:00'); return isNaN(d)?'No date set':d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); };

  const checkSVG = '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const lockSVG = '<svg viewBox="0 0 24 24" width="15" height="15"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
  const flagSVG = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 3v18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 4h11l-3 4 3 4H6" fill="currentColor" stroke="none"/></svg>';

  /* ---------- layering & layout ---------- */
  function computeLayers(){
    const memo = {};
    function layerOf(id){
      if(memo[id]!==undefined) return memo[id];
      if(id==='goal'){
        const deps = goalDeps();
        memo[id] = deps.length ? 1+Math.max(...deps.map(layerOf)) : 0;
        return memo[id];
      }
      const t = taskById(id);
      memo[id] = t.dependsOn.length ? 1+Math.max(...t.dependsOn.map(layerOf)) : 0;
      return memo[id];
    }
    state.tasks.forEach(t=>layerOf(t.id));
    layerOf('goal');
    return memo;
  }

  function layout(orientation){
    const memo = computeLayers();
    const maxLayer = Math.max(...Object.values(memo));
    const byLayer = {};
    Object.entries(memo).forEach(([id,l])=>{ (byLayer[l]=byLayer[l]||[]).push(id); });

    const spacingMain = orientation==='vertical' ? 168 : 190;
    const spacingPerp = orientation==='vertical' ? 128 : 118;
    const padMain = orientation==='vertical' ? 74 : 90;
    const padPerp = orientation==='vertical' ? 92 : 72;
    const maxCount = Math.max(...Object.values(byLayer).map(a=>a.length));

    const positions = {};
    for(let l=0; l<=maxLayer; l++){
      const ids = byLayer[l] || [];
      const n = ids.length;
      ids.forEach((id,i)=>{
        const offset = (i-(n-1)/2) * spacingPerp;
        const main = padMain + l*spacingMain;
        const perp = padPerp + (maxCount-1)/2*spacingPerp + offset;
        positions[id] = orientation==='vertical' ? {x:perp,y:main} : {x:main,y:perp};
      });
    }
    const mainExtent = padMain*2 + maxLayer*spacingMain;
    const perpExtent = padPerp*2 + Math.max(0,maxCount-1)*spacingPerp;
    const size = orientation==='vertical' ? {width:perpExtent,height:mainExtent} : {width:mainExtent,height:perpExtent};
    return {positions, size};
  }

  function addContours(svg,w,h,orientation){
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','contour');
    for(let i=0;i<3;i++){
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      let d='';
      if(orientation==='horizontal'){
        const y = h*(0.22+i*0.28);
        d = `M 0 ${y}`;
        const step = Math.max(w/8,20);
        for(let x=step;x<=w;x+=step){ d += ` L ${x} ${y+Math.sin(x/90+i)* (16+i*6)}`; }
      } else {
        const x = w*(0.22+i*0.28);
        d = `M ${x} 0`;
        const step = Math.max(h/8,20);
        for(let y=step;y<=h;y+=step){ d += ` L ${x+Math.sin(y/90+i)*(12+i*5)} ${y}`; }
      }
      path.setAttribute('d',d);
      g.appendChild(path);
    }
    svg.appendChild(g);
  }

  function markerIcon(ds,isGoal){
    if(isGoal) return flagSVG;
    if(ds==='complete') return checkSVG;
    if(ds==='locked') return lockSVG;
    return '';
  }

  function buildNodeEl(id,title,due,ds,pos,isGoal){
    const wrap = document.createElement('div');
    wrap.className = 'waypoint '+(isGoal?'is-goal ':'')+'state-'+ds;
    wrap.style.left = pos.x+'px';
    wrap.style.top = pos.y+'px';
    wrap.dataset.id = id;
    wrap.innerHTML = `<button class="marker" aria-label="${escapeHtml(title)}">${markerIcon(ds,isGoal)}</button>
      <div class="label"><span class="label-title">${escapeHtml(title)}</span><span class="label-date">${isGoal?('by '+formatDate(due)):formatDate(due)}</span></div>`;
    return wrap;
  }

  /* ---------- render ---------- */
  function updateHeader(){
    document.getElementById('goalTitleEl').textContent = state.goalTitle || 'Set your destination';
    document.getElementById('goalDateEl').textContent = state.goalDate ? ('Destination · '+formatDateLong(state.goalDate)) : '';
    const total = state.tasks.length;
    const done = state.tasks.filter(t=>t.status==='complete').length;
    document.getElementById('progressText').textContent = total ? (done+' of '+total+' waypoints reached') : 'No waypoints yet';
    document.getElementById('progressFill').style.width = (total?Math.round(done/total*100):0)+'%';
  }

  function render(){
    updateHeader();
    const orientation = window.innerWidth < 760 ? 'vertical' : 'horizontal';
    currentOrientation = orientation;
    const canvasWrap = document.getElementById('canvasWrap');
    const canvas = document.getElementById('canvas');

    if(!state.goalTitle){
      canvasWrap.className = 'canvas-wrap scroll-y-page';
      canvas.className = 'canvas canvas-empty';
      canvas.style.width=''; canvas.style.height='';
      canvas.innerHTML = `<div class="empty-card">
        <h2>Where are you headed?</h2>
        <p>Name the destination and set a target date. You can change both later.</p>
        <form id="goalSetupForm" class="empty-form">
          <input name="title" placeholder="e.g. Publish my novel" required maxlength="60"/>
          <input name="date" type="date"/>
          <button type="submit" class="btn-primary">Set destination</button>
        </form></div>`;
      return;
    }
    if(state.tasks.length===0){
      canvasWrap.className = 'canvas-wrap scroll-y-page';
      canvas.className = 'canvas canvas-empty';
      canvas.style.width=''; canvas.style.height='';
      canvas.innerHTML = `<div class="empty-card">
        <h2>No waypoints yet</h2>
        <p>Break &ldquo;${escapeHtml(state.goalTitle)}&rdquo; into the first steps that get you there.</p>
        <button id="firstWaypointBtn" class="btn-primary">+ Add your first waypoint</button></div>`;
      return;
    }

    canvasWrap.className = 'canvas-wrap ' + (orientation==='horizontal' ? 'scroll-x' : 'scroll-y-page');
    canvas.className = 'canvas orientation-'+orientation;
    const {positions, size} = layout(orientation);
    canvas.style.width = size.width+'px';
    canvas.style.height = size.height+'px';
    canvas.innerHTML = '';

    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width', size.width);
    svg.setAttribute('height', size.height);
    svg.classList.add('edges');
    canvas.appendChild(svg);
    addContours(svg, size.width, size.height, orientation);

    const edgeList = [];
    state.tasks.forEach(t=>t.dependsOn.forEach(d=>edgeList.push({from:d,to:t.id})));
    goalDeps().forEach(d=>edgeList.push({from:d,to:'goal'}));

    edgeList.forEach(e=>{
      const p1 = positions[e.from], p2 = positions[e.to];
      if(!p1||!p2) return;
      const fromComplete = e.from!=='goal' && taskById(e.from).status==='complete';
      const toState = e.to==='goal' ? goalDisplayState() : displayState(taskById(e.to));
      let cls = 'locked';
      if(fromComplete && toState==='complete') cls='complete';
      else if(fromComplete) cls='active';
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      let d;
      if(orientation==='horizontal'){
        const dx=(p2.x-p1.x)/2;
        d = `M ${p1.x} ${p1.y} C ${p1.x+dx} ${p1.y}, ${p2.x-dx} ${p2.y}, ${p2.x} ${p2.y}`;
      } else {
        const dy=(p2.y-p1.y)/2;
        d = `M ${p1.x} ${p1.y} C ${p1.x} ${p1.y+dy}, ${p2.x} ${p2.y-dy}, ${p2.x} ${p2.y}`;
      }
      path.setAttribute('d', d);
      path.setAttribute('class', 'edge edge-'+cls);
      svg.appendChild(path);
    });

    state.tasks.forEach(t=>{
      canvas.appendChild(buildNodeEl(t.id, t.title, t.due, displayState(t), positions[t.id], false));
    });
    canvas.appendChild(buildNodeEl('goal', state.goalTitle, state.goalDate, goalDisplayState(), positions['goal'], true));
  }

  /* ---------- panel content ---------- */
  function taskPanelHTML(t){
    const ds = displayState(t);
    let statusControls = '';
    if(ds==='locked'){
      const incomplete = t.dependsOn.filter(id=>taskById(id).status!=='complete');
      statusControls = `<div class="locked-note">Locked — waiting on:</div>
        <div class="chip-row">${incomplete.map(id=>`<button type="button" class="dep-chip dep-${displayState(taskById(id))}" data-id="${id}">${escapeHtml(taskById(id).title)}</button>`).join('')}</div>`;
    } else if(ds==='available'){
      statusControls = `<div class="pill-row">
        <button class="pill pill-brass" data-action="set-status" data-id="${t.id}" data-status="in-progress">Start</button>
        <button class="pill pill-outline" data-action="set-status" data-id="${t.id}" data-status="complete">Mark complete</button>
      </div>`;
    } else if(ds==='in-progress'){
      statusControls = `<div class="pill-row">
        <button class="pill pill-seafoam" data-action="set-status" data-id="${t.id}" data-status="complete">Mark complete</button>
      </div><button class="pill-link" data-action="set-status" data-id="${t.id}" data-status="todo">Move back to to-do</button>`;
    } else if(ds==='complete'){
      statusControls = `<div class="complete-note">✓ Completed</div>
        <button class="pill-link" data-action="set-status" data-id="${t.id}" data-status="todo">Reopen</button>`;
    }
    let depsChips = '';
    if(t.dependsOn.length){
      depsChips = `<div class="field-label">Depends on</div><div class="chip-row">${t.dependsOn.map(id=>{
        const dt=taskById(id); return `<button type="button" class="dep-chip dep-${displayState(dt)}" data-id="${id}">${escapeHtml(dt.title)}</button>`;
      }).join('')}</div>`;
    }
    const subtasksHtml = t.subtasks.map((s,i)=>`<label class="subtask-row">
        <input type="checkbox" class="subtask-check" data-task-id="${t.id}" data-index="${i}" ${s.done?'checked':''}/>
        <span class="${s.done?'done':''}">${escapeHtml(s.text)}</span></label>`).join('');

    return `<button class="panel-close" data-action="close" aria-label="Close">✕</button>
      <div class="panel-eyebrow">Waypoint</div>
      <h2 class="panel-title">${escapeHtml(t.title)}</h2>
      <div class="panel-date">Due ${formatDateLong(t.due)}</div>
      ${statusControls}
      ${depsChips}
      <div class="field-label">Notes</div>
      <p class="panel-desc">${escapeHtml(t.desc||'No notes yet.')}</p>
      <div class="field-label">Checklist</div>
      <div class="subtask-list">${subtasksHtml || '<div class="muted-small">No checklist items.</div>'}</div>
      <form id="addSubtaskForm" data-task-id="${t.id}" class="add-subtask-form">
        <input name="text" placeholder="Add a checklist item" maxlength="80"/>
        <button type="submit" class="pill-link">Add</button>
      </form>
      <button class="delete-link" data-action="delete-task" data-id="${t.id}">Delete waypoint</button>`;
  }

  function goalPanelHTML(){
    const chips = goalDeps().map(id=>{
      const dt=taskById(id); return `<button type="button" class="dep-chip dep-${displayState(dt)}" data-id="${id}">${escapeHtml(dt.title)}</button>`;
    }).join('') || '<span class="muted-small">Add waypoints to connect them here.</span>';
    return `<button class="panel-close" data-action="close" aria-label="Close">✕</button>
      <div class="panel-eyebrow">Destination</div>
      <h2 class="panel-title">${escapeHtml(state.goalTitle)}</h2>
      <form id="goalForm" class="goal-form">
        <label class="field-label">Goal name<input name="title" value="${escapeHtml(state.goalTitle)}" required maxlength="60"/></label>
        <label class="field-label">Target date<input name="date" type="date" value="${state.goalDate||''}"/></label>
        <button type="submit" class="pill pill-brass">Save</button>
      </form>
      <div class="field-label">Feeds into this destination</div>
      <div class="chip-row">${chips}</div>`;
  }

  function newTaskFormHTML(){
    const list = state.tasks.map(t=>`<label class="check-row"><input type="checkbox" name="deps" value="${t.id}"/> ${escapeHtml(t.title)}</label>`).join('')
      || '<span class="muted-small">No existing waypoints yet — this will be the first.</span>';
    return `<button class="panel-close" data-action="close" aria-label="Close">✕</button>
      <div class="panel-eyebrow">New waypoint</div>
      <h2 class="panel-title">Add a waypoint</h2>
      <form id="newTaskForm" class="goal-form">
        <label class="field-label">Title<input name="title" required maxlength="60" placeholder="e.g. Send query letters"/></label>
        <label class="field-label">Due date<input name="date" type="date"/></label>
        <div class="field-label">Depends on</div>
        <div class="check-list">${list}</div>
        <label class="field-label">Notes<textarea name="desc" rows="3" maxlength="240" placeholder="Optional"></textarea></label>
        <button type="submit" class="pill pill-brass">Create waypoint</button>
      </form>`;
  }

  function openPanel(id){
    const panel = document.getElementById('panel');
    if(id==='new') panel.innerHTML = newTaskFormHTML();
    else if(id==='goal') panel.innerHTML = goalPanelHTML();
    else { const t=taskById(id); if(!t) return; panel.innerHTML = taskPanelHTML(t); }
    panel.classList.add('open');
    document.getElementById('scrim').classList.add('open');
  }
  function closePanel(){
    document.getElementById('panel').classList.remove('open');
    document.getElementById('scrim').classList.remove('open');
  }
  function setStatus(id,status){
    const t = taskById(id); if(!t) return;
    t.status = status;
    render();
    openPanel(id);
  }

  /* ---------- wiring ---------- */
  document.getElementById('addWaypointBtn').addEventListener('click', ()=>openPanel('new'));
  document.getElementById('goalTitleEl').addEventListener('click', ()=>{ if(state.goalTitle) openPanel('goal'); });
  document.getElementById('newGoalBtn').addEventListener('click', ()=>{
    if(confirm('Start a new goal? This clears the current one.')){
      state.goalTitle=''; state.goalDate=''; state.tasks=[];
      closePanel(); render();
    }
  });

  document.getElementById('canvas').addEventListener('click', (e)=>{
    const firstBtn = e.target.closest('#firstWaypointBtn');
    if(firstBtn){ openPanel('new'); return; }
    const wp = e.target.closest('.waypoint');
    if(wp) openPanel(wp.dataset.id);
  });
  document.getElementById('canvas').addEventListener('submit', (e)=>{
    e.preventDefault();
    if(e.target.id==='goalSetupForm'){
      const fd = new FormData(e.target);
      state.goalTitle = (fd.get('title')||'').trim() || 'Untitled goal';
      state.goalDate = fd.get('date')||'';
      render();
    }
  });

  document.getElementById('panel').addEventListener('click', (e)=>{
    if(e.target.closest('[data-action="close"]')){ closePanel(); return; }
    const delEl = e.target.closest('[data-action="delete-task"]');
    if(delEl){
      if(confirm('Delete this waypoint? Tasks depending on it will need new dependencies.')){
        const id = delEl.dataset.id;
        state.tasks = state.tasks.filter(t=>t.id!==id);
        state.tasks.forEach(t=>{ t.dependsOn = t.dependsOn.filter(d=>d!==id); });
        closePanel(); render();
      }
      return;
    }
    const statusEl = e.target.closest('[data-action="set-status"]');
    if(statusEl){ setStatus(statusEl.dataset.id, statusEl.dataset.status); return; }
    const chip = e.target.closest('.dep-chip');
    if(chip){ openPanel(chip.dataset.id); return; }
  });

  document.getElementById('panel').addEventListener('change', (e)=>{
    const cb = e.target.closest('.subtask-check');
    if(cb){
      const task = taskById(cb.dataset.taskId);
      task.subtasks[Number(cb.dataset.index)].done = cb.checked;
      const span = cb.nextElementSibling;
      if(span) span.classList.toggle('done', cb.checked);
    }
  });

  document.getElementById('panel').addEventListener('submit', (e)=>{
    e.preventDefault();
    if(e.target.id==='addSubtaskForm'){
      const taskId = e.target.dataset.taskId;
      const fd = new FormData(e.target);
      const text = (fd.get('text')||'').trim();
      if(text){ taskById(taskId).subtasks.push({text, done:false}); }
      openPanel(taskId);
    } else if(e.target.id==='goalForm'){
      const fd = new FormData(e.target);
      state.goalTitle = (fd.get('title')||'').trim() || state.goalTitle;
      state.goalDate = fd.get('date')||'';
      closePanel(); render();
    } else if(e.target.id==='newTaskForm'){
      const fd = new FormData(e.target);
      const title = (fd.get('title')||'').trim();
      if(!title) return;
      const id = 't'+(taskIdCounter++);
      state.tasks.push({
        id, title, due: fd.get('date')||'', status:'todo',
        dependsOn: fd.getAll('deps'), desc: (fd.get('desc')||'').trim(), subtasks: []
      });
      closePanel(); render();
    }
  });

  document.getElementById('scrim').addEventListener('click', closePanel);

  let resizeTimer;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      const o = window.innerWidth < 760 ? 'vertical' : 'horizontal';
      if(o!==currentOrientation) render();
    }, 150);
  });

  render();
})();
</script>
</body>
</html>
